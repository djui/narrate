[project]
name = "narrate"
version = "0.1.0"
description = "Turn a DRM-free EPUB into a chaptered M4B audiobook, offline, on Apple Silicon"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "lxml>=5.2",
    "numpy>=1.26",
    "soundfile>=0.12",
    "mlx-audio>=0.6.3",
    "misaki[en]>=0.9.4",
]

[project.scripts]
narrate = "narrate.cli:main"

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
