name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
      - name: Swift tests
        run: swift test
      - name: App builds
        run: swift build -c release --product NarrateApp

  corpus:
    # Ingest and chunk plan on real books match tests/corpus/ (nothing is rendered).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build/corpus
          key: corpus-${{ hashFiles('tests/corpus.txt') }}
      - name: Compare on the EPUB corpus
        run: |
          swift build -c release --product narrate
          scripts/corpus.sh
